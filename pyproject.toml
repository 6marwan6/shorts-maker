[project]
name = "shorts-maker"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
description = "Short-form virality shorts tool (implementation plan v1.2 / product plan v5.0)"

# Dependency groups per implementation plan section 4.1.
# uv + uv.lock is the committed lockfile (decision #2, README decision log).
# NOTE: "pyscenedetect" in the plan is not a PyPI package; the project is published as "scenedetect" (decision #4, README decision log).
[dependency-groups]
api = ["fastapi", "uvicorn", "pydantic", "pydantic-settings", "email-validator", "sqlalchemy", "asyncpg", "alembic", "httpx", "redis", "celery>=5.6,<5.7", "argon2-cffi", "cryptography", "boto3"]
worker = ["celery>=5.6,<5.7", "redis", "orjson", "jsonschema"]
media = [
    "numpy",
    "scipy",
    "opencv-python",
    "mediapipe",
    "librosa",
    "soundfile",
    "scenedetect>=0.7,<0.8",
]
# torch: uv.lock currently resolves a default CPU torch build (transitively, via sentence-transformers/
# whisperx in the `ml` group). This is a PLACEHOLDER, not the final pin -- implementation plan 1.6.2
# requires the exact ROCm 7.2.2-compatible PyTorch wheel to be frozen after the RX 7800 XT smoke test
# (a [[tool.uv.index]] pointing at download.pytorch.org's ROCm index, most likely). Re-lock after that
# smoke test; do not treat this transitive resolution as the frozen GPU-dev pin.
# pyannote-audio + fasttext added explicitly for Phase 3 (owner decision G8, 2026-09-30); pyannote-audio
# was previously only transitive via whisperx. The fastText lid.176.ftz MODEL is a vendored, hash-pinned
# artifact under models/fasttext/ -- never downloaded at runtime.
ml = ["sentence-transformers", "transformers", "whisperx", "faster-whisper", "pyannote-audio>=4.0,<5", "fasttext"]
observability = ["sentry-sdk"]
test = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "jsonschema",
    "orjson",
    "numpy",
    "ruff",
    "mypy",
    "shorts-config",
    "datamodel-code-generator>=0.82.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (Depends() in argument defaults) is FastAPI's own required dependency-injection idiom
# (impl plan §1.3 FastAPI), not a real bug -- see every apps/api/app/routers/*.py handler.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages/config/src", ".", "apps/api"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["packages/config/src", ".", "apps/api"]
testpaths = ["tests"]
markers = ["real_models: Phase 3 exit-gate smoke tests that need real WhisperX/pyannote/fastText (BLOCKED until G3 + model provisioning; REQUIRE_REAL_MODELS=1 turns BLOCKED into failure)"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/config"]

[tool.uv.sources]
shorts-config = { workspace = true }
